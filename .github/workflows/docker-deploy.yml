name: Build & Deploy Docker to ECS

on:
  push:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: docker-deploy
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Deploy to server via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_SSH_PORT || 22 }}
          script: |
            set -e

            IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest"

            echo "==> Saving GHCR credentials on server..."
            mkdir -p ~/.docker
            echo "${{ secrets.GHCR_TOKEN }}" | docker login ${{ env.REGISTRY }} -u ${{ github.actor }} --password-stdin

            echo "==> Pulling latest image..."
            docker pull "$IMAGE"

            echo "==> Stopping old containers..."
            cd /opt/meeting-app
            docker compose down || true

            echo "==> Checking .env file..."
            if [ ! -f .env ]; then
              echo "WARNING: .env file not found! Creating default .env..."
              cat > .env << 'ENVEOF'
ARK_API_KEY=
AI_API_KEY=
AI_BASE_URL=https://ark.cn-beijing.volces.com/api/v3
AI_MODEL=doubao-seed-1-8-251228
STT_API_KEY=
STT_BASE_URL=https://api.siliconflow.cn/v1
STT_MODEL=TeleAI/TeleSpeechASR
PORT=3001
BIND_HOST=0.0.0.0
MYSQL_HOST=mysql
MYSQL_PORT=3306
MYSQL_USER=root
MYSQL_PASSWORD=root
MYSQL_DATABASE=zglxm
ENVEOF
            fi
            cat .env

            echo "==> Starting MySQL first..."
            docker compose up -d mysql
            echo "==> Waiting for MySQL to be healthy..."
            sleep 15

            echo "==> Starting app and nginx..."
            docker compose up -d --no-deps app
            echo "==> Waiting for app to start..."
            sleep 10

            docker compose up -d --no-deps nginx

            echo "==> Checking container status..."
            docker compose ps

            echo "==> App logs:"
            docker compose logs --tail=30 app

            echo "==> Cleaning up old images..."
            docker image prune -f

            echo "==> Deploy complete."
