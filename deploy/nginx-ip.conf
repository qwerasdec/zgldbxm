# 无域名、仅用公网 IP 访问。部署前把 __DEPLOY_IP__ 换成你的 ECS 公网 IP（如 112.124.13.31）
# 安装：sudo cp deploy/nginx-ip.conf /etc/nginx/sites-available/meeting
#       sudo ln -sf /etc/nginx/sites-available/meeting /etc/nginx/sites-enabled/meeting
#       sudo rm -f /etc/nginx/sites-enabled/default
#       sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name __DEPLOY_IP__ _;

    root /opt/meeting-app/dist;
    index index.html;

    client_max_body_size 50m;

    location /socket.io/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

