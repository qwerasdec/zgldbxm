# 含 80 + 443（自签证书）。先 bash deploy/gen-ssl-ip.sh IP
# 用法: sudo sed "s/__DEPLOY_IP__/112.124.13.31/g" deploy/nginx-ip-with-https.conf > /etc/nginx/sites-available/meeting

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name __DEPLOY_IP__ _;
    root /opt/meeting-app/dist;
    index index.html;
    client_max_body_size 50m;
    location /socket.io/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    # iPhone：用 http 下载自签证书，安装并信任后再访问 https（见 deploy/MOBILE-IOS.md）
    location = /ios-cert.crt {
        alias /opt/meeting-app/deploy/ssl/ip.crt;
        default_type application/x-x509-ca-cert;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name __DEPLOY_IP__ _;
    ssl_certificate     /opt/meeting-app/deploy/ssl/ip.crt;
    ssl_certificate_key /opt/meeting-app/deploy/ssl/ip.key;
    root /opt/meeting-app/dist;
    index index.html;
    client_max_body_size 50m;
    location /socket.io/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}
